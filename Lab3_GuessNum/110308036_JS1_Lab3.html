<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>111306086_Number Guessing Game</title>
</head>

<body>
    <h1>111306086_Number Guessing Game</h1>

    <div id="result"></div>

    <script>
        // 產生 1–100 的隨機整數
        var answer = Math.floor(Math.random() * 100) + 1;

        var chances = 7;
        var low = 1;
        var high = 100;

        while (chances > 0) {
            var input = window.prompt(
                "請輸入 " + low + " 到 " + high + " 之間的整數。\n" +
                "你還有 " + chances + " 次機會。"
            );

            // 若按取消 -> 直接結束遊戲
            if (input === null) {
                alert("遊戲取消！");
                break;
            }

            input = input.trim();

            // 空值或非數字
            if (input === "" || isNaN(input)) {
                alert("請輸入有效的數字！");
                continue;
            }

            var guess = Number(input);

            // 超出範圍
            if (guess < low || guess > high) {
                alert("請輸入有效範圍內的數字（不能超出 " + low + " 到 " + high + "）！");
                continue;
            }

            chances--;

            if (guess === answer) {
                alert("恭喜你答對了！正確答案是 " + answer);
                document.getElementById("result").innerHTML =
                    '<img src="images/correct.jpg" width="350">';
                break;
            }

            if (guess < answer) {
                low = guess + 1;
            } else {
                high = guess - 1;
            }

            if (chances === 0) {
                alert("很可惜！你用完了所有機會。\n正確答案是 " + answer);
                document.getElementById("result").innerHTML =
                    '<img src="images/wrong.jpg" width="350">';
            }
        }
    </script>

</body>
</html>
